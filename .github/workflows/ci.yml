name: CI

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl-version:
          - '5.20'
          - '5.26'
          - '5.30'
          - '5.34'
          - '5.38'
          - '5.40'
          - '5.42'
    container:
      image: perldocker/perl-tester:${{ matrix.perl-version }}
    steps:
      - uses: actions/checkout@v4
      - run: perl -V
      - run: perl Makefile.PL
      - run: make
      - run: make test

  alpine:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Install dependencies
        run: apk add --no-cache git perl perl-dev make gcc musl-dev
      - uses: actions/checkout@v4
      - run: perl -V
      - run: perl Makefile.PL
      - run: make
      - run: make test

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        perl-version:
          - '5.26'
          - '5.34'
          - '5.40'
          - '5.42'
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}
      - run: perl -V
      - run: perl Makefile.PL
      - run: make
      - run: make test

  asan:
    runs-on: ubuntu-latest
    container:
      image: perldocker/perl-tester:5.40
    steps:
      - uses: actions/checkout@v4
      - run: perl Makefile.PL OPTIMIZE="-O1 -g -fsanitize=address -fno-omit-frame-pointer"
      - run: make OTHERLDFLAGS="-fsanitize=address"
      - name: make test (ASAN)
        run: |
          ASAN_LIB=$(cc -print-file-name=libasan.so)
          LD_PRELOAD="$ASAN_LIB" ASAN_OPTIONS=detect_leaks=0 make test

  valgrind:
    runs-on: ubuntu-latest
    container:
      image: perldocker/perl-tester:5.40
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -q && apt-get install -y -q valgrind
      - run: perl Makefile.PL OPTIMIZE="-O0 -g"
      - run: make
      - name: make test (valgrind)
        run: |
          # Gate on valgrind's own exit code. Scraping the byte count out of the
          # log did not work: valgrind prints thousands separators, so
          # `grep -oP '\d+(?= bytes)'` turned "1,000 bytes" into "000", which
          # the numeric test then passed. --errors-for-leak-kinds=definite
          # already makes a definite leak an error, so --error-exitcode is all
          # that is needed.
          # t/fortune.t alone covered 9 of 740 assertions and none of the
          # croak, compile-error or sorted paths, which is where every leak
          # fixed in 0.02 and 0.03 lived.
          for t in t/regressions.t t/generic.t t/edge_coverage.t t/fortune.t; do
            echo "== $t"
            valgrind --leak-check=full --show-leak-kinds=definite \
              --errors-for-leak-kinds=definite --error-exitcode=99 \
              --suppressions=.github/valgrind.supp \
              --log-file=/tmp/vg.log \
              perl -Iblib/lib -Iblib/arch "$t" || { cat /tmp/vg.log; exit 1; }
            grep -E '(definitely lost|ERROR SUMMARY)' /tmp/vg.log
          done

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y perl5
          run: |
            perl -V
            perl Makefile.PL
            make
            make test
